['💸','Переводы игрокам',['Можно перевести $ другому игроку: <b>по @username</b> (комиссия 5%, получатель видит твой Telegram-профиль) или <b>по ID</b> (комиссия 8%, обе стороны остаются анонимными).','Есть минимум и дневной лимит, который растёт с уровнем. Сейчас включён тест-режим: сервер ещё не подключён, получатель деньги не получит.'],[['app','tr','Открыть переводы']]],
['⚙️','Настройки',['Звук, вибрация, подтверждение переводов. Здесь же экспорт и импорт сохранения: игра хранит прогресс только на устройстве, так что копию лучше делать заранее.'],[['app','set','Открыть настройки']]],
['✨','Советы новичку',['1. Забирай всё бесплатное: колесо, календарь, ежедневный кейс, задания.','2. Купи бизнес пораньше — доход капает, пока ты офлайн.','3. Чини и мой машину перед гонкой.','4. Ракета и апгрейдер — рискованно, ставь только лишнее.','5. Копи 🔑 для дорогих кейсов: Hyper и Секретный дают лучшие машины.'],[]]
];
function guideView(){const o=S.gs===undefined?0:S.gs;
const ck=[['🎰','Крутани рулетку',(S.sp||0)>0,'tab','play','Рулетка'],['🚗','Забери машину в гараж',S.cars.length>0,'tab','garage','Гараж'],['💼','Купи первый бизнес',Object.values(S.biz||{}).some(n=>n>0),'app','bizz','Бизнесы'],['🎡','Крутани Колесо Фортуны',(S.wt||0)>0,'app','bonus','Колесо'],['📦','Открой любой кейс',(S.ch||[]).length>0,'app','case','Кейсы'],['📸','Опубликуй пост в Gramm',(S.gt||0)>0,'phone',0,'CarOS']],dn=ck.filter(x=>x[2]).length;
return`<div class=card><div class=row><b style="font-size:17px">📖 Быстрый старт</b><span class=sp></span><b style="color:#4cd964">${dn}/${ck.length}</b></div><div class=bar style="margin:8px 0"><i style="width:${dn/ck.length*100}%"></i></div>${ck.map(x=>`<div class=row style="padding:5px 0"><span style="font-size:20px">${x[2]?'✅':x[0]}</span><div class=sp style="${x[2]?'opacity:.5;text-decoration:line-through':''}">${x[1]}</div>${x[2]?'':B(x[3],x[4],x[5],'gold')}</div>`).join('')}</div>
<div class=m style="margin:4px 4px 8px">Подробно о каждой механике — нажимай на разделы:</div>`+GUIDE.map((g,i)=>`<div class=card style="padding:0;overflow:hidden"><button data-a=gs data-v=${i} style="width:100%;text-align:left;display:flex;gap:10px;align-items:center;background:none;border-radius:0;padding:14px 12px"><span style="font-size:24px">${g[0]}</span><b style="flex:1">${g[1]}</b><span class=m>${i==o?'▲':'▼'}</span></button>${i==o?`<div style="padding:0 14px 14px">${g[2].map(l=>`<div style="margin:6px 0;line-height:1.45">${l}</div>`).join('')}${g[3].length?`<div class=chips style="flex-wrap:wrap">${g[3].map(b=>B(b[0],b[1],b[2],'go')).join('')}</div>`:''}</div>`:''}</div>`).join('')}
V.guide=guideView;
const TRF={u:.05,i:.08},TR_LIVE=false,TR_MIN=1000;
const accUn=()=>{const u=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user;return u&&u.username?'@'+u.username:(S.un||'')};
const csGid=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=n=>Array.from({length:n},()=>c[Math.random()*c.length|0]).join('');return 'CE-'+r(4)+'-'+r(4)};
function trCap(){const t=new Date().toDateString();if(!S.trd||S.trd.d!=t)S.trd={d:t,s:0};return 5e5*Math.max(1,lvl())-S.trd.s}
const trMode=t=>/^CE-/i.test((t||'').trim())?'i':'u';
function trPrevH(){const to=(S.trTo||'').trim(),m=trMode(to),a=Math.floor(+S.trAmt||0),fee=Math.ceil(a*TRF[m]),cap=Math.max(0,trCap());
return`<div class=m>${to?(m=='i'?'🔒 По ID · комиссия '+Math.round(TRF.i*100)+'%':'👤 По @username · комиссия '+Math.round(TRF.u*100)+'%'):'Введи @username или ID вида CE-XXXX-XXXX'}<br>Сумма ${csMoney(a)} · комиссия ${csMoney(fee)} · получатель получит <b style="color:#4cd964">${csMoney(Math.max(0,a-fee))}</b><br>Лимит на сегодня: осталось ${csMoney(cap)} · минимум ${csMoney(TR_MIN)}</div>`}
function trPrev(){const e=$('#trp');if(!e)return;trKeep();e.innerHTML=trPrevH()}
function trKeep(){const a=$('#tr_to'),b=$('#tr_am');if(a)S.trTo=a.value;if(b)S.trAmt=Math.floor(+b.value||0)}
function trSend(){trKeep();let to=(S.trTo||'').trim();const m=trMode(to),a=Math.floor(+S.trAmt||0);
if(m=='u'){to='@'+to.replace(/^@/,'');if(!/^@[A-Za-z][A-Za-z0-9_]{4,31}$/.test(to))return toast('Введи @username или ID вида CE-XXXX-XXXX')}else{to=to.toUpperCase();if(!/^CE-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(to))return toast('ID вида CE-XXXX-XXXX')}
if(to==S.gid||to.toLowerCase()==accUn().toLowerCase())return toast('Нельзя перевести самому себе');
const fee=Math.ceil(a*TRF[m]);if(a<TR_MIN)return toast('Минимум '+csMoney(TR_MIN));if(a>S.m)return toast('Не хватает денег');if(a>trCap())return toast('Превышен дневной лимит');
if(!TR_LIVE){S.trl=[{t:Date.now(),to,m,a,fee,tst:1},...(S.trl||[])].slice(0,20);S.trAmt='';toast('🧪 Тест: деньги не списаны, сервер не подключён');save();render();return}
if(S.cf!==0&&!confirm('Перевести '+csMoney(a)+' → '+to+'?\nКомиссия '+csMoney(fee)+', получатель получит '+csMoney(a-fee)))return;
/* TODO сервер: POST /api/transfer {to,mode:m,amount:a} -> зачислить a-fee получателю */
S.m-=a;S.trd.s+=a;S.trSent=(S.trSent||0)+a;S.trFee=(S.trFee||0)+fee;S.trl=[{t:Date.now(),to,m,a,fee},...(S.trl||[])].slice(0,20);S.trAmt='';push('💸 Перевод '+to+': −'+csMoney(a));snd('win');toast('Перевод отправлен');save();render()}
function trV(){const a=Math.floor(+S.trAmt||0);
return(TR_LIVE?'':'<div class="card" style="border-color:#f5c542"><small>🧪 Тест-режим: сервер не подключён. Деньги не списываются и получателю не приходят.</small></div>')+
`<div class=card><b>💸 Перевод игроку</b><input id=tr_to placeholder="@username или ID (CE-XXXX-XXXX)" value="${S.trTo||''}" style="margin:8px 0"><input id=tr_am type=number inputmode=numeric placeholder="Сумма, $" value="${a||''}">
<div class=chips>${[1e4,1e5,1e6].map(n=>B('tra',n,csMoney(n))).join('')}${B('tra','max','Макс')}</div><div id=trp style="margin:6px 0">${trPrevH()}</div>${B('trs',0,'Отправить'+(TR_LIVE?'':' (тест)'),'gold')}</div>`+
((S.trl||[]).length?`<div class=card><b>История переводов</b>${S.trl.slice(0,8).map(x=>`<div class=m style="padding:3px 0">${new Date(x.t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${x.to} · ${x.tst?csMoney(x.a)+' · тест, не списано':'−'+csMoney(x.a)+' (комиссия '+csMoney(x.fee)+')'}</div>`).join('')}</div>`:'')}
function accV(){S.gid=S.gid||csGid();S.pv=S.pv||{u:1,h:0};const un=accUn(),tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user&&Telegram.WebApp.initDataUnsafe.user.username;
return`<div class=card style="text-align:center"><div style="font-size:46px">👤</div><b style="font-size:18px">${S.nick||'Игрок'}</b><br><small>${un?(S.pv.h?'@username скрыт':un):'@username не указан'} · ур. ${lvl()}</small><div style="margin:12px 0 4px"><small>Игровой ID</small><div style="font-size:24px;font-weight:800;letter-spacing:1px">${S.gid}</div></div>${B('cpid',0,'📋 Скопировать ID')}<div class=m style="margin-top:8px">ID не связан с Telegram-профилем: по нему можно получать переводы анонимно.</div></div>
<div class=card><b>Профиль</b><input id=nk placeholder="Имя в игре" maxlength=16 value="${S.nick||''}" style="margin:8px 0">${tg?'':`<input id=un placeholder="Мой @username в Telegram" maxlength=33 value="${S.un||''}" style="margin-bottom:8px">`}${B('nick',0,'Сохранить','go')}</div>
<div class=card><b>Приватность</b><div class=chips style="flex-wrap:wrap">${B('pvu',0,'Переводы по @username: '+(S.pv.u?'вкл':'выкл'),S.pv.u?'go':'')}${B('pvh',0,'Скрыть @username: '+(S.pv.h?'да':'нет'),S.pv.h?'go':'')}</div><div class=m>Если @username скрыт или переводы по нему выключены, тебя можно найти только по ID. Переключатели заработают, когда подключится сервер переводов.</div></div>
<div class=card><b>Статистика</b><div class=m>Отправлено переводов: ${csMoney(S.trSent||0)} · комиссий: ${csMoney(S.trFee||0)}<br>Круток рулетки: ${S.sp||0} · авто в гараже: ${S.cars.length}</div></div>`}
function setV(){return`<div class=card><b>⚙️ Настройки</b><div class=chips style="flex-wrap:wrap;margin-top:8px">${B('snd',0,'Звук: '+(S.snd?'вкл':'выкл'),S.snd?'go':'')}${B('vb',0,'Вибрация: '+(S.vb===0?'выкл':'вкл'),S.vb===0?'':'go')}${B('cf',0,'Подтверждать переводы: '+(S.cf===0?'нет':'да'),S.cf===0?'':'go')}</div><div class=m>Telegram WebApp: ${window.Telegram&&Telegram.WebApp?'подключён':'не подключён (вне Telegram)'}</div></div>
<div class=card><b>💾 Сохранение</b><div class=m>Прогресс хранится только на этом устройстве. «Экспорт» выдаст код, «Импорт» восстановит прогресс из кода.</div><textarea id=sv placeholder="Код сохранения" style="width:100%;height:70px;margin:8px 0;border:0;border-radius:12px;background:var(--c2);color:var(--t);padding:8px;font:12px monospace"></textarea><div class=chips>${B('exp',0,'Экспорт')}${B('imp',0,'Импорт')}</div></div>
<div class=card><div class=chips>${B('gw0',0,'Показать приветствие')}${B('reset',0,'Сбросить прогресс','red')}</div></div>`}
function homeCard(){const lv=lvl(),need=Math.pow(lv,2)*40,prev=Math.pow(lv-1,2)*40,pc=Math.max(0,Math.min(100,(auth()-prev)/(need-prev)*100)),td=new Date().toDateString(),wr=Date.now()-(S.wt||0)>=72e5,dr=S.dcd!=td;
return`<div class="card cbx" style="--k:#f5c542"><div class=row><div style="font-size:34px">${S.g=='f'?'👩‍💼':'🧑‍💼'}</div><div class=sp><b>${S.nick||'Игрок'}</b> · ур. ${lv}<div class=bar><i style="width:${pc}%;background:#f5c542"></i></div><small>Авторитет ${auth()} / ${need} до ур. ${lv+1}</small></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px">${[['🏎️','Гараж',S.cars.length+'/'+cap()],['💼','Доход','+'+csMoney(Math.round(inc()))+'/мин'],['🎰','Круток',S.sp||0]].map(x=>`<div style="background:var(--c2);border-radius:12px;padding:6px 4px;text-align:center"><small>${x[0]} ${x[1]}</small><br><b style="font-size:13px">${x[2]}</b></div>`).join('')}</div><div class=chips style="margin-top:10px">${B('collect',0,'💳 Собрать '+csMoney(Math.floor(S.acc)),'go',S.acc<1)}${B('app','case',dr?'🎁 Бесплатный кейс':'🎁 Кейсы',dr?'gold':'')}</div><div class=chips>${B('app','bonus',wr?'🎡 Колесо готово':'🎡 Колесо',wr?'gold':'')}${B('app','quest','📋 Задания')}</div></div>`}
V.acc=accV;V.tr=trV;V.set=setV;S.gid=S.gid||csGid();try{const T=window.Telegram&&Telegram.WebApp;if(T){T.ready();T.expand();if(T.disableVerticalSwipes)T.disableVerticalSwipes()}}catch(e){}document.addEventListener('input',e=>{const i=e.target&&e.target.id;if(i=='tr_to'||i=='tr_am')trPrev()});


render();
</script></body></html>
